openapi: 3.0.3
info:
  title: Pass — Core API
  description: >
    API сервиса доставки еды Pass. Обслуживает клиентов, владельцев ресторанов
    и курьеров. Аутентификация — Bearer JWT, выдаётся при регистрации и логине.
  version: "0.1.0"
servers:
  - url: http://localhost:5050
    description: Локальная разработка

tags:
  - name: Auth
    description: Регистрация и вход

security:
  - bearerAuth: []

paths:
  # ---------- AUTH ----------
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                phone: { type: string }
                role:
                  type: string
                  enum: [customer, restaurant_owner, courier]
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: Email уже занят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
# ---------- USERS ----------
  /users/me:
    get:
      tags: [Users]
      summary: Текущий пользователь
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      summary: Обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                name: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/addresses:
    get:
      tags: [Users]
      summary: Список адресов пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Address" }
    post:
      tags: [Users]
      summary: Добавить адрес
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Адрес создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /users/me/addresses/{addressId}:
    parameters:
      - $ref: "#/components/parameters/AddressId"
    patch:
      tags: [Users]
      summary: Изменить адрес
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Users]
      summary: Удалить адрес
      responses:
        "204": { description: Удалено }
        "404": { $ref: "#/components/responses/NotFound" }

  responses:
    ValidationError:
      description: Ошибка валидации входных данных
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }


  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "validation_error" }
        message: { type: string, example: "email is required" }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string }
        role:
          type: string
          enum: [customer, restaurant_owner, courier, admin]
        created_at: { type: string, format: date-time }

    AddressInput:
      type: object
      required: [city, street, house]
      properties:
        city: { type: string }
        street: { type: string }
        house: { type: string }
        apartment: { type: string }
        comment: { type: string }
        is_default: { type: boolean }

    Address:
      allOf:
        - { $ref: "#/components/schemas/AddressInput" }
        - type: object
          properties:
            id: { type: string, format: uuid }
            user_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
